version: '3.8'

services:
  # ==========================================
  # KAFKA STREAMING INFRASTRUCTURE
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: icestream-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - icestream-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: icestream-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - icestream-network

  # ==========================================
  # FLINK REAL-TIME ENGINE
  # ==========================================
  flink-jobmanager:
    build:
      context: ./flink-pipeline
      dockerfile: Dockerfile
    container_name: icestream-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    networks:
      - icestream-network

  flink-taskmanager:
    build:
      context: ./flink-pipeline
      dockerfile: Dockerfile
    container_name: icestream-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    networks:
      - icestream-network

  # ==========================================
  # LAKEHOUSE STORAGE (MINIO FOR ICEBERG)
  # ==========================================
  minio:
    image: minio/minio:RELEASE.2023-05-18T00-12-52Z
    container_name: icestream-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    networks:
      - icestream-network

  # ==========================================
  # PYTHON TELEMETRY GENERATOR
  # ==========================================
  data-generator:
    build:
      context: ./generator
      dockerfile: Dockerfile
    container_name: icestream-generator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: checkout_events
      SEND_INTERVAL_SEC: 1.0
      ANOMALY_RATE: 0.05
    depends_on:
      - kafka
    networks:
      - icestream-network

  # ==========================================
  # GREAT EXPECTATIONS VALIDATOR
  # ==========================================
  observability-validator:
    build:
      context: ./observability
      dockerfile: Dockerfile
    container_name: icestream-validator
    volumes:
      - shared-data:/tmp
    environment:
      VALIDATION_REPORT_PATH: /tmp/validation_report.json
    networks:
      - icestream-network

  # ==========================================
  # EXPRESS BACKEND GATEWAY
  # ==========================================
  express-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: icestream-backend
    ports:
      - "3001:3001"
    volumes:
      - shared-data:/tmp
    environment:
      PORT: 3001
      VALIDATION_REPORT_PATH: /tmp/validation_report.json
    depends_on:
      - kafka
    networks:
      - icestream-network

  # ==========================================
  # VITE REACT DASHBOARD
  # ==========================================
  frontend-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: icestream-frontend
    ports:
      - "3000:80"
    depends_on:
      - express-gateway
    networks:
      - icestream-network

networks:
  icestream-network:
    name: icestream-network
    driver: bridge

volumes:
  shared-data:
    name: icestream-shared-data
