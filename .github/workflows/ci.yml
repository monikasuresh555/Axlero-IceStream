name: IceStream Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ==========================================
  # Job 1: Lint & Verify Python Data Generator
  # ==========================================
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f services/data-generator/requirements.txt ]; then pip install -r services/data-generator/requirements.txt; fi
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 services/data-generator --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 services/data-generator --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ==========================================
  # Job 2: Build & Verify Flink Processor (Java/Maven)
  # ==========================================
  flink-java-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Test with Maven
        run: |
          cd services/flink-processor
          mvn clean compile test --batch-mode

  # ==========================================
  # Job 3: Build & Lint Express API Gateway
  # ==========================================
  express-gateway-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: services/express-gateway/package.json

      - name: Install Gateway Dependencies
        run: |
          cd services/express-gateway
          npm ci

      - name: Compile TypeScript Gateway
        run: |
          cd services/express-gateway
          npm run build

  # ==========================================
  # Job 4: Build & Lint Frontend React Dashboard
  # ==========================================
  frontend-dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: services/frontend-dashboard/package.json

      - name: Install Frontend Dependencies
        run: |
          cd services/frontend-dashboard
          npm ci

      - name: Build Frontend Application
        run: |
          cd services/frontend-dashboard
          npm run build
